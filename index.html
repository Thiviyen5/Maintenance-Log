<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Machine Maintenance Log</title>
<style>
:root{
  --ink:#20241f;--paper:#f3f1ea;--card:#fff;--slate:#22344a;
  --slate-dark:#182636;--amber:#e2963c;--amber-dark:#c67c26;
  --ok:#3f7d58;--attn:#c24a3b;--line:#dedad0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:Arial,sans-serif;padding-bottom:45px}
.topbar{background:var(--slate-dark);color:#fff;padding:15px 18px;
font-weight:700;letter-spacing:.06em}
.machine-card{margin:16px;background:var(--slate);color:#fff;border-radius:10px;
padding:20px}
.machine-card h1{margin:0 0 14px;font-size:28px}
.machine-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;
border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.small-label{font-size:11px;text-transform:uppercase;color:#b9c6d4}
.machine-value{font-size:18px;font-weight:700;margin-top:3px}
form{margin:0 16px}
.section{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:16px;margin-bottom:14px}
.section h2{margin:0 0 14px;color:var(--amber-dark);font-size:14px;
text-transform:uppercase;letter-spacing:.08em}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);
border-radius:8px;font-size:16px;margin-bottom:14px}
textarea{min-height:80px;resize:vertical}
.check-row{display:flex;align-items:center;justify-content:space-between;
gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:none}
.check-name{font-size:14px;font-weight:600}
.choices{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.choices button{border:0;border-right:1px solid var(--line);background:#fff;
padding:8px 9px;font-weight:700;cursor:pointer}
.choices button:last-child{border-right:0}
.choices .ok{background:var(--ok);color:#fff}
.choices .attn{background:var(--attn);color:#fff}
.choices .na{background:#81817b;color:#fff}
.signature-box{border:1.5px dashed #aaa;border-radius:8px;background:#fff;padding:6px}
#signaturePad{display:block;width:100%;height:160px;background:#fff;
border-radius:6px;touch-action:none}
.signature-actions{display:flex;justify-content:space-between;margin-top:8px;
font-size:12px;color:#666}
.signature-actions button{border:0;background:none;color:var(--slate);
font-weight:700;cursor:pointer}
#submitBtn{width:100%;border:0;border-radius:9px;padding:15px;background:var(--amber);
font-size:18px;font-weight:800;cursor:pointer}
#submitBtn:disabled{background:#ccc}
#status{display:none;margin:12px 16px;padding:12px;border-radius:8px;text-align:center}
#status.ok{display:block;background:#e5f0e9;color:var(--ok)}
#status.err{display:block;background:#f6e6e2;color:var(--attn)}
.warning{margin:0 16px 14px;padding:11px;background:#fff2df;border:1px solid #efc794;
border-radius:8px;font-size:13px}
</style>
</head>
<body>

<div class="topbar">MACHINE MAINTENANCE LOG</div>

<div class="machine-card">
  <div class="small-label">Machine</div>
  <h1 id="machineName">Unknown machine</h1>
  <div class="machine-grid">
    <div><div class="small-label">Machine No.</div><div class="machine-value" id="machineNumber">—</div></div>
    <div><div class="small-label">Area</div><div class="machine-value" id="machineArea">—</div></div>
  </div>
</div>

<div id="machineWarning" class="warning" style="display:none">
This link has no machine information. Use a QR-code link containing
?id=...&name=...&number=...&area=...
</div>

<form id="maintenanceForm">
  <div class="section">
    <h2>Inspection Date</h2>
    <input type="date" id="inspectionDate" required>
  </div>

  <div class="section">
    <h2>Inspection Checklist</h2>
    <div id="checklist"></div>
  </div>

  <div class="section">
    <h2>Remarks / Parts Replacement</h2>
    <textarea id="remarks" placeholder="Enter findings, issues or parts replaced"></textarea>
  </div>

  <div class="section">
    <h2>Serviced By</h2>
    <label for="workerName">Full Name</label>
    <input type="text" id="workerName" required>

    <label for="employeeNo">Employee No.</label>
    <input type="text" id="employeeNo" required>

    <label>Signature</label>
    <div class="signature-box">
      <canvas id="signaturePad"></canvas>
    </div>
    <div class="signature-actions">
      <span>Sign using finger, stylus or mouse</span>
      <button type="button" id="clearSignature">Clear signature</button>
    </div>
  </div>

  <button type="submit" id="submitBtn">Submit Record</button>
</form>

<div id="status"></div>

<script>
// Paste the COMPLETE URL generated by "When an HTTP request is received".
const SUBMIT_ENDPOINT = "https://default7f048fc12ea348e4ac9291d1eb0980.7c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/7a461f73d89f49328e34ff6f8e9c42b7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=7-QNbWCRV8qTC7PakIUv7dmTXsxbWuFuNJCFgDHUZ8s";

const query = new URLSearchParams(window.location.search);
const machine = {
  id: query.get("id") || "",
  name: query.get("name") || "",
  number: query.get("number") || "",
  area: query.get("area") || ""
};

document.getElementById("machineName").textContent = machine.name || "Unknown machine";
document.getElementById("machineNumber").textContent = machine.number || "—";
document.getElementById("machineArea").textContent = machine.area || "—";
if (!machine.id && !machine.name && !machine.number && !machine.area) {
  document.getElementById("machineWarning").style.display = "block";
}
document.getElementById("inspectionDate").value = new Date().toISOString().slice(0,10);

const checklistItems = [
  "Cleanliness","Bearing","Sensor","Control Panel",
  "Cylinder Track / Orbit","Hydraulic Oil","Coolant","Grease","Belt"
];
const checklistState = {};
const checklist = document.getElementById("checklist");

checklistItems.forEach(item => {
  const row = document.createElement("div");
  row.className = "check-row";
  row.innerHTML = `
    <span class="check-name">${item}</span>
    <span class="choices" data-item="${item}">
      <button type="button" data-value="OK">OK</button>
      <button type="button" data-value="ATTN">Attention</button>
      <button type="button" data-value="NA">N/A</button>
    </span>`;
  checklist.appendChild(row);
});

checklist.addEventListener("click", event => {
  const button = event.target.closest("button[data-value]");
  if (!button) return;
  const group = button.closest(".choices");
  group.querySelectorAll("button").forEach(btn => btn.className = "");
  const value = button.dataset.value;
  if (value === "OK") button.className = "ok";
  if (value === "ATTN") button.className = "attn";
  if (value === "NA") button.className = "na";
  checklistState[group.dataset.item] = value;
});

// Signature pad
const canvas = document.getElementById("signaturePad");
const ctx = canvas.getContext("2d");
let drawing = false;
let signed = false;
let lastX = 0;
let lastY = 0;

function resizeCanvas() {
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#20241f";
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function pointerPosition(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

canvas.addEventListener("pointerdown", event => {
  drawing = true;
  signed = true;
  canvas.setPointerCapture(event.pointerId);
  const p = pointerPosition(event);
  lastX = p.x;
  lastY = p.y;
});

canvas.addEventListener("pointermove", event => {
  if (!drawing) return;
  const p = pointerPosition(event);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x;
  lastY = p.y;
});

function stopDrawing() { drawing = false; }
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("pointerleave", stopDrawing);

document.getElementById("clearSignature").addEventListener("click", () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  signed = false;
});

  function getSignaturePng() {
  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;

  const exportContext = exportCanvas.getContext("2d");

  // Add a solid white background.
  exportContext.fillStyle = "#ffffff";
  exportContext.fillRect(
    0,
    0,
    exportCanvas.width,
    exportCanvas.height
  );

  // Copy the signature onto the white background.
  exportContext.drawImage(canvas, 0, 0);

  return exportCanvas.toDataURL("image/png");
}
  
document.getElementById("maintenanceForm").addEventListener("submit", async event => {
  event.preventDefault();

  const status = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");
  status.className = "";
  status.style.display = "none";

  if (!SUBMIT_ENDPOINT.startsWith("https://")) {
    status.textContent = "The form is not connected to Power Automate yet.";
    status.className = "err";
    return;
  }

  if (checklistItems.some(item => !checklistState[item])) {
    status.textContent = "Please complete every checklist item.";
    status.className = "err";
    return;
  }

  if (!signed) {
    status.textContent = "Please provide your signature.";
    status.className = "err";
    return;
  }

const now = new Date();

const recordId =
  (machine.number || "MACHINE") + "-" +
  now.getFullYear() +
  String(now.getMonth() + 1).padStart(2, "0") +
  String(now.getDate()).padStart(2, "0") + "-" +
  String(now.getHours()).padStart(2, "0") +
  String(now.getMinutes()).padStart(2, "0") +
  String(now.getSeconds()).padStart(2, "0");

  const payload = {
    recordId,
    submittedAt: new Date().toISOString(),
    inspectionDate: document.getElementById("inspectionDate").value,
    machineId: machine.id,
    machineName: machine.name,
    machineNumber: machine.number,
    area: machine.area,
    cleanliness: checklistState["Cleanliness"],
    bearing: checklistState["Bearing"],
    sensor: checklistState["Sensor"],
    controlPanel: checklistState["Control Panel"],
    cylinderTrackOrbit: checklistState["Cylinder Track / Orbit"],
    hydraulicOil: checklistState["Hydraulic Oil"],
    coolant: checklistState["Coolant"],
    grease: checklistState["Grease"],
    belt: checklistState["Belt"],
    remarks: document.getElementById("remarks").value.trim(),
    workerName: document.getElementById("workerName").value.trim(),
    employeeNo: document.getElementById("employeeNo").value.trim(),
    signaturePng: getSignaturePng()
  };

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {
    await fetch(SUBMIT_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify(payload)
    });

    status.textContent = "Maintenance record submitted successfully.";
    status.className = "ok";

setTimeout(() => {
    window.location.href = "thank-you.html";
  }, 1200);
  } catch (error) {
    console.error(error);
    status.textContent = "Submission failed. Check the internet connection.";
    status.className = "err";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Record";
  }
});
</script>
</body>
</html>
