<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Complete</title>
  <style>
    :root {
      --paper: #f3f1ea;
      --card: #ffffff;
      --ink: #20241f;
      --ok: #3f7d58;
      --line: #dedad0;
      --slate: #22344a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #e5f0e9;
      color: var(--ok);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--ok);
      font-size: 28px;
    }

    p {
      margin: 8px 0;
      line-height: 1.5;
      color: #555;
    }

    .note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: #777;
    }

    .close-btn {
      margin-top: 20px;
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      background: var(--slate);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .close-btn:active { opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Record Submitted</h1>
    <p>The maintenance record has been sent successfully.</p>
    <p>You may now close this page.</p>

    <button class="close-btn" onclick="closePage()">Close Page</button>

    <div class="note">
      If the page does not close automatically, close the browser tab manually.
    </div>
  </div>

  <script>
    function closePage() {
      window.close();

      setTimeout(() => {
        document.querySelector(".note").textContent =
          "Your browser blocked automatic closing. Please close this tab manually.";
      }, 300);
    }
  </script>
</body>
</html>
